name: Build & Release BiFlow

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Default to read-only for every job (including pull requests); only the
# release job below re-declares write access for creating the release.
permissions:
  contents: read

# Supply-chain pinning (round-2 audit): third-party actions are pinned
# to commit SHAs (verified against the GitHub API when pinned).
# dtolnay/rust-toolchain is the deliberate exception: its REF selects
# the toolchain (@stable / @1.90), so a SHA pin would change what gets
# installed.

jobs:
  audit:
    name: Dependency audit (cargo audit, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        # Non-blocking by design: findings show in the job log/summary
        # without failing releases; promote to blocking once the
        # baseline is clean.
        continue-on-error: true
        run: cargo audit


  build:
    name: Build BiFlow (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --locked --verbose

      # The hook DLL is always compiled from source by build.rs into
      # OUT_DIR; there is no committed prebuilt DLL to refresh or delete.

      - name: Build Release Binary
        run: cargo build --locked --release

      - name: Stage Executable and Package
        shell: powershell
        run: |
          $candidates = @(
            "target/x86_64-pc-windows-msvc/release/biflow.exe",
            "target/release/biflow.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            throw "Executable not found in target directories"
          }

          # Stage root executable
          Copy-Item $exe -Destination "BiFlow.exe" -Force

          # Create Portable Release Directory
          $portableDir = "BiFlow-Portable"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item "BiFlow.exe" -Destination "$portableDir/BiFlow.exe" -Force
          Copy-Item "README.md" -Destination "$portableDir/README.txt" -Force
          Compress-Archive -Path "$portableDir/*" -DestinationPath "BiFlow-Portable-Windows-x64.zip" -Force

          # Publish SHA-256 checksums next to the artifacts
          $hashExe = (Get-FileHash "BiFlow.exe" -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash "BiFlow-Portable-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BiFlow.exe" | Out-File -Encoding ascii "SHA256SUMS.txt"
          "$hashZip  BiFlow-Portable-Windows-x64.zip" | Out-File -Encoding ascii -Append "SHA256SUMS.txt"

          Write-Host "Staged BiFlow.exe and created BiFlow-Portable-Windows-x64.zip" -ForegroundColor Green

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BiFlow-Windows-x64
          path: |
            BiFlow.exe
            BiFlow-Portable-Windows-x64.zip
            SHA256SUMS.txt
          retention-days: 14

  msrv:
    name: MSRV check (Rust 1.90)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust 1.90 toolchain
        uses: dtolnay/rust-toolchain@1.90
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # The declared rust-version must actually build: the locked
      # dependencies (tray-icon 0.26.0) require Rust 1.90 even though the
      # manifest once claimed 1.74.
      - name: Check with the declared minimum toolchain
        run: cargo check --locked

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: BiFlow-Windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            BiFlow.exe
            BiFlow-Portable-Windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
