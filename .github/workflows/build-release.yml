name: Build & Release BiFlow

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Default to read-only for every job (including pull requests); only the
# release job below re-declares write access for creating the release.
permissions:
  contents: read

jobs:
  build:
    name: Build BiFlow (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --locked --verbose

      # The hook DLL is always compiled from source by build.rs into
      # OUT_DIR; there is no committed prebuilt DLL to refresh or delete.

      - name: Build Release Binary
        run: cargo build --locked --release

      - name: Stage Executable and Package
        shell: powershell
        run: |
          $candidates = @(
            "target/x86_64-pc-windows-msvc/release/biflow.exe",
            "target/release/biflow.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            throw "Executable not found in target directories"
          }

          # Stage root executable
          Copy-Item $exe -Destination "BiFlow.exe" -Force

          # Create Portable Release Directory
          $portableDir = "BiFlow-Portable"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item "BiFlow.exe" -Destination "$portableDir/BiFlow.exe" -Force
          Copy-Item "README.md" -Destination "$portableDir/README.txt" -Force
          Compress-Archive -Path "$portableDir/*" -DestinationPath "BiFlow-Portable-Windows-x64.zip" -Force

          # Publish SHA-256 checksums next to the artifacts
          $hashExe = (Get-FileHash "BiFlow.exe" -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash "BiFlow-Portable-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BiFlow.exe" | Out-File -Encoding ascii "SHA256SUMS.txt"
          "$hashZip  BiFlow-Portable-Windows-x64.zip" | Out-File -Encoding ascii -Append "SHA256SUMS.txt"

          Write-Host "Staged BiFlow.exe and created BiFlow-Portable-Windows-x64.zip" -ForegroundColor Green

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiFlow-Windows-x64
          path: |
            BiFlow.exe
            BiFlow-Portable-Windows-x64.zip
            SHA256SUMS.txt
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BiFlow-Windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BiFlow.exe
            BiFlow-Portable-Windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
